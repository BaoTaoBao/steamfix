[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steamfix"
version = "2.1.0"
description = "Fix Steam Store / Steam Community being blocked by your ISP (DNS + SNI filtering) by pinning working Akamai edge IPs in the hosts file."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SteamFix contributors" }]
keywords = ["steam", "hosts", "dns", "sni", "censorship", "vietnam", "isp", "akamai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
steamfix = "steamfix.cli:main"

[project.urls]
Homepage = "https://github.com/BaoTaoBao/steamfix"
Source = "https://github.com/BaoTaoBao/steamfix"
Issues = "https://github.com/BaoTaoBao/steamfix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steamfix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
# UP045/SIM105: giữ Optional[...] và try/except tường minh cho dễ đọc với Python 3.9.
ignore = ["E501", "UP006", "UP035", "UP045", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]
